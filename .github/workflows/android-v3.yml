name: Build Android APK (v3)

# The v3 rewrite lives in its own sub-project (imperial-crown-v3/) so the
# shipped 2.0.1 APK and its source stay exactly as they were. This workflow
# drives the whole v3 pipeline out of that directory: unit + sim + renderer
# suites, the real browser play test, the soak, then the signed APK.
#
# Everything runs with working-directory: imperial-crown-v3, so the paths in
# scripts/build-apk.sh, tests/ and dist/ are the ones v3 was developed against.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish / update the GitHub release with this APK'
        type: boolean
        default: true
  push:
    branches: [main, 'arena/**']
    paths:
      - 'imperial-crown-v3/**'
      - '.github/workflows/android-v3.yml'
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apk-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: imperial-crown-v3
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: imperial-crown-v3/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build-tools
        working-directory: .
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          ls "$ANDROID_HOME/build-tools"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_ENV"
          echo "PLATFORM=$ANDROID_HOME/platforms/android-34" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 17 suites: shell, contract, geometry, audio, shaders, sim, survey,
      # combat, day/night, renderer, perf budgets, input direction, pacing,
      # AI, HUD, application, bundle.
      - name: Unit + integration tests
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee ci-test.log

      - name: Build web bundle
        run: npm run build

      - name: Bundle contract test
        run: |
          set -o pipefail
          node tests/dist.test.mjs 2>&1 | tee -a ci-test.log

      - name: Browser smoke test (real headless Chrome)
        id: browser
        continue-on-error: true
        run: |
          (npm ls puppeteer-core >/dev/null 2>&1 || npm i --no-save puppeteer-core@23 @sparticuz/chromium@131) 2>&1 | tee -a browser-test.log
          node tests/browser.mjs --seconds 8 --dpr 1.5 --out ci/screenshots 2>&1 | tee -a browser-test.log

      # 220-entity battle on the phone profile: heap after forced GC, tick cost,
      # draw calls, DOM size.
      - name: Soak test (phone profile)
        id: soak
        continue-on-error: true
        run: |
          node tests/soak.mjs --seconds 40 --units 260 2>&1 | tee -a soak.log

      - name: Play test (a whole session in Chrome)
        id: playtest
        continue-on-error: true
        run: |
          node tests/playtest.mjs --out ci/screenshots 2>&1 | tee -a playtest.log

      - name: Publish browser diagnostics
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Browser diagnostics (v3)'
            echo
            echo "browser: \`${{ steps.browser.outcome }}\` · playtest: \`${{ steps.playtest.outcome }}\` · soak: \`${{ steps.soak.outcome }}\`"
            echo
            echo '```'
            tail -n 60 browser-test.log 2>/dev/null || echo 'no log written'
            echo '```'
            echo
            cat ci/browser-report.md 2>/dev/null || echo '_no report written_'
            echo
            cat ci/playtest-report.md 2>/dev/null || echo '_no play test report written_'
            echo
            cat ci/soak-report.md 2>/dev/null || echo '_no soak report written_'
          } > ci/browser-diagnostics.md
          cat ci/browser-diagnostics.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file ci/browser-diagnostics.md
          fi

      - name: Check the browser run actually reported
        run: |
          test -s ci/browser-report.md || { echo "::error::ci/browser-report.md missing or empty"; exit 1; }
          test -d ci/screenshots || { echo "::error::no screenshots written"; exit 1; }
          ls -la ci/screenshots | head -20
          grep -qi "all browser checks passed" ci/browser-report.md || { echo "::error::browser checks did not pass"; cat ci/browser-report.md; exit 1; }

      - name: Check the play test passed
        run: |
          test -s ci/playtest-report.md || { echo "::error::ci/playtest-report.md missing"; exit 1; }
          grep -qi "PLAYTEST PASSED" ci/playtest-report.md || {
            echo "::error::the play test did not pass"; cat ci/playtest-report.md; exit 1; }
          grep -c '✅' ci/playtest-report.md

      - name: Check the soak actually passed
        run: |
          test -s ci/soak-report.md || { echo "::error::ci/soak-report.md missing"; exit 1; }
          grep -qi "soak passed" ci/soak-report.md || { echo "::error::soak checks did not pass"; cat ci/soak-report.md; exit 1; }

      - name: Upload screenshots + browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-browser-screenshots
          path: |
            imperial-crown-v3/ci/screenshots
            imperial-crown-v3/ci/browser-report.md
            imperial-crown-v3/ci/playtest-report.md
            imperial-crown-v3/ci/soak-report.md
            imperial-crown-v3/browser-test.log
            imperial-crown-v3/playtest.log
            imperial-crown-v3/soak.log
          retention-days: 30
          if-no-files-found: error

      - name: Build APK
        run: |
          chmod +x scripts/build-apk.sh
          set -o pipefail
          ./scripts/build-apk.sh 2>&1 | tee apk-build.log

      - name: Post APK build log on failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### APK build failed (v3)'
            echo
            echo '```'
            tail -n 80 apk-build.log 2>/dev/null || echo 'no apk-build.log'
            echo '```'
          } > apk-failure.md
          cat apk-failure.md >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr list --head "$GITHUB_REF_NAME" --json number -q '.[0].number' 2>/dev/null || true)
          fi
          if [ -n "$PR_NUMBER" ]; then gh pr comment "$PR_NUMBER" --body-file apk-failure.md; fi
          tail -n 60 apk-build.log 2>/dev/null | sed 's/^/::error::/' || true

      - name: Verify APK
        run: |
          APK=$(ls build/imperial-crown-*.apk | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee apk-verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apk-verify.txt
          grep "Signer #1 certificate SHA-256" apk-verify.txt
          "$BUILD_TOOLS/zipalign" -c -p 4 "$APK"
          unzip -l "$APK" | grep -q "classes.dex" || { echo "::error::APK contains no classes.dex"; exit 1; }
          unzip -l "$APK" | grep -q "assets/www/index.html" || { echo "::error::APK contains no game"; exit 1; }
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -12
          cp "$APK" imperial-crown-3d.apk
          ls -lh imperial-crown-3d.apk
          sha256sum imperial-crown-3d.apk | tee apk-sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: imperial-crown-3d-apk
          path: |
            imperial-crown-v3/imperial-crown-3d.apk
            imperial-crown-v3/apk-sha256.txt
          retention-days: 90

      - name: Publish release
        if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v3') || github.event_name == 'workflow_dispatch' && inputs.release) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")-mobile"
          NOTES="Imperial Crown 3D — mobile build (v3 engine).

          * Same game, same UI, rebuilt renderer and simulation.
          * Custom WebGL2 engine tuned for the Realme 9i / Adreno 610:
            baked lighting, one shadow tap, 30 Hz simulation with interpolated
            rendering, flow-free pathfinding with per-tick budgets.
          * Fully offline: the entire game ships inside the APK.
          * Sideload with \`adb install imperial-crown-3d.apk\`.
          * The previous 2.0.1 build is untouched and still on its own release.

          Built from \`${GITHUB_SHA::7}\` on $(date -u +%Y-%m-%d)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" imperial-crown-3d.apk apk-sha256.txt --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" imperial-crown-3d.apk apk-sha256.txt \
              --title "Imperial Crown 3D — $TAG" --notes "$NOTES"
          fi
          gh release view "$TAG" --json assets,url -q '.url, .assets[].url'

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-build-logs
          path: |
            imperial-crown-v3/ci-test.log
            imperial-crown-v3/apk-build.log
            imperial-crown-v3/apk-sha256.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Job summary
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### Imperial Crown 3D v3 build"
            echo '```'
            echo "sha:    $GITHUB_SHA"
            echo "branch: $GITHUB_REF_NAME"
            echo
            echo "== tests =="
            tail -12 ci-test.log 2>/dev/null || echo "(no test log)"
            echo
            echo "== apk =="
            tail -22 apk-build.log 2>/dev/null || echo "(no apk log)"
            cat apk-sha256.txt 2>/dev/null || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
