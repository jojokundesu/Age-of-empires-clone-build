name: Probe
on:
  push:
    branches: ["arena/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump env
        run: |
          mkdir -p ci/logs
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            java -version 2>&1
            echo "--- build-tools"; ls $ANDROID_HOME/build-tools 2>&1
            echo "--- platforms"; ls $ANDROID_HOME/platforms 2>&1
            echo "--- tools"; which aapt2 apksigner zipalign d8 javac keytool node npm 2>&1
            echo "--- chrome"; which google-chrome chromium chromium-browser 2>&1; google-chrome --version 2>&1 | head -1
          } > ci/logs/env.txt 2>&1
          cat ci/logs/env.txt
      - name: Commit env log
        run: |
          git config user.name "ci-bot"; git config user.email "ci@local"
          git add ci/logs/env.txt
          git commit -m "ci: env log [ci-artifacts]" || true
          git push || true
