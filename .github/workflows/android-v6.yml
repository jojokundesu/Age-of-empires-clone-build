name: Build Android APK (v6)

# v6 is its own app (ai.arena.imperialcrown.v6) so it installs side by side with
# v5 and keeps its own save file. A normal push validates the branch but does
# not publish; a release is made by an explicit dispatch, or by a commit whose
# message contains [release v6].
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the v6 preview APK'
        type: boolean
        default: true
  push:
    branches: [main, 'arena/**']
    paths:
      - 'imperial-crown-v6/**'
      - '.github/workflows/android-v6.yml'
  pull_request:
    branches: [main]
    paths:
      - 'imperial-crown-v6/**'
      - '.github/workflows/android-v6.yml'

permissions:
  contents: write

concurrency:
  group: apk-v6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: imperial-crown-v6
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Read the version this build will carry
        run: |
          node -e '
            const v = require("./package.json").version;
            const [a, b, c] = v.split(".").map(Number);
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_ENV, `VERSION=${v}\nVERSION_CODE=${a * 10000 + b * 100 + (c || 0)}\n`);
            console.log(`version ${v} (${a * 10000 + b * 100 + (c || 0)})`);
          '
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: imperial-crown-v6/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_ENV"
          echo "PLATFORM=$ANDROID_HOME/platforms/android-34" >> "$GITHUB_ENV"
      - name: Install dependencies and build web assets
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Run full regression suite
        run: |
          set -o pipefail
          eval "$(node scripts/browser-libs.mjs --export)"
          npm run test:ci
      - name: Exercise first person and panels in a mobile-sized browser
        run: |
          eval "$(node scripts/browser-libs.mjs --export)"
          npm run test:v5-browser
      - name: Check the layout on a 892x412 phone screen
        run: |
          eval "$(node scripts/browser-libs.mjs --export)"
          node tests/phoneshot.mjs --out ci/phone
      - name: Build the signed APK
        run: npm run apk
      - name: Verify signatures, identity, alignment and bundled web assets
        run: |
          set -euo pipefail
          APK="build/imperial-crown-${VERSION}.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 23 --max-sdk-version 23 "$APK" | grep -F 'Verified using v1 scheme (JAR signing): true'
          "$BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 24 --max-sdk-version 24 "$APK" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          "$BUILD_TOOLS/zipalign" -c -p 4 "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -F "package: name='ai.arena.imperialcrown.v6' versionCode='${VERSION_CODE}' versionName='${VERSION}'"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          VERSION = os.environ["VERSION"]
          with ZipFile(f"build/imperial-crown-{VERSION}.apk") as z:
              assert z.getinfo('classes.dex').file_size > 0
              assets = [p for p in Path('dist').rglob('*') if p.is_file()]
              for p in assets:
                  name = 'assets/www/' + p.relative_to('dist').as_posix()
                  assert z.read(name) == p.read_bytes(), f'APK asset mismatch: {name}'
              print(f'Verified {len(assets)} exact web assets and classes.dex')
          PY
          cp "$APK" imperial-crown-3d-v6.apk
          sha256sum imperial-crown-3d-v6.apk > apk-sha256.txt
          cat apk-sha256.txt
      - name: Retain the tested APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: imperial-crown-3d-v6-apk
          path: |
            imperial-crown-v6/imperial-crown-3d-v6.apk
            imperial-crown-v6/apk-sha256.txt
          retention-days: 90
      - name: Publish v6 preview release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release v6]')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}-preview"
          cat > "$RUNNER_TEMP/v6-release-notes.md" <<'NOTES'
          ## Imperial Crown 3D v6.2.0 — Android preview

          Built from this commit and verified in this run: the whole regression suite, the Chromium
          first-person and panel pass, the 892x412 phone-layout check, the signatures, the alignment,
          the package identity and every byte of the bundled web app.

          **This is the answer to the list you sent after playing 6.1.0**, point for point.

          ### Mana and cooldowns: the ladder now changes how you fight

          Mana is 250 at Apprentice and 1000 at Ascendant, regenerating 14 to 64 per second, so an
          empty bar is never the reason a fight is lost. Every rank also takes a bite out of every
          cooldown: an Ascendant pays a tenth of the printed number, so a fireball comes back in
          0.32 s and the long spells return *inside* the same fight. SKYFALL is three castings a day
          at Ascendant, chosen on the world map, and the book says "2 left" rather than lying about
          tomorrow.

          ### One mage, and he comes back

          Exactly one mage walks the field per team — the tower no longer raises the cap, it teaches
          faster. When he falls the Order sends another out of the nearest hall 45 seconds later, at
          **Apprentice** rank, with a full bar: the ladder is climbed again.

          ### The book has no duplicates any more

          One single-target and one area spell per element, and every other spell earns its slot:
          Fireball (one body, burning) and Meteor (delayed 5 m blast); Ice Lance (freezes the man it
          hits) and Frost Nova (freezes what surrounds you). The old second area-freeze, Stasis, is now
          **Shatterfrost**: triple damage against anything already frozen or slowed — the finisher the
          ice book was missing.

          ### Golems grow with rank

          Rank 4 raises one Stone Golem; rank 5 adds a Granite Colossus that slams the ground and slows
          everything around it; rank 6 adds an Obsidian Titan that hurls molten rock at range and sets
          what it lands on alight. The lifetime timer stays — they are a siege tool, not an army.

          ### Blink is a teleport

          30 metres, in any direction, and it lands as close as the ground allows instead of refusing
          because the last centimetre of the line is a wall.

          ### You can cast while you run

          Spells fire on the touch itself, not on a click the browser may never deliver while the other
          thumb is holding the stick. Measured with the body walking and sprinting: mana is spent, the
          spell lands, the run continues. An armed spell can also be released with a tap in first
          person, which it could not do at all before.

          ### Ice you can see

          A frozen man is encased in a crystal of ice for the whole freeze, and an area freeze sheets
          the ground under it until the spell expires. Time Warp, Thunderstorm, Hailstorm, the golems'
          footprint, and every Arcane Ward now hold their own mark on the ground for their real
          duration instead of a flash and nothing.

          ### Health regeneration, written down

          Every soldier who has not been hit for 6 seconds recovers up to a third of his health at
          0.9 hp/s — enough to hold a wall again, never enough to become a new man. Berserkers and the
          Champion's **Field Medic** perk heal past that cap; monks heal others. All of it is in the
          new **Codex**.

          ### The Codex

          A new section on the main menu: every spell with its mana, cooldown and range, the whole rank
          ladder, the mana and cooldown rules, the golems, the ice, the regeneration numbers, and every
          Champion perk in the game — read from the live data, so it cannot drift from the rules.

          ### Farms and building placement

          Tapping a finished farm with villagers selected now sends them to harvest it (this is the
          order that was simply missing), and the field they are sent to stays their home instead of
          being re-picked from scratch. The building ghost follows your finger every frame and turns
          red where the footprint is illegal, and the build lands exactly on the point the ghost is
          standing on; a tap that misses the ground is refused with a reason instead of raising the
          building five to ten metres away.

          It installs **over 6.1.0** (same key, versionCode 60200) and stays beside v5. Signed with the
          repository's public demo key for testing. Sustained frame rate, heat and battery on the
          physical Realme 9i are still unmeasured -- that needs the phone.

          Download `imperial-crown-3d-v6.apk` below; the SHA-256 file lets you verify it.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" --jq '.object.sha')
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Refusing to overwrite $TAG: it belongs to a different commit." >&2
              exit 1
            fi
            gh release upload "$TAG" imperial-crown-3d-v6.apk apk-sha256.txt --clobber
            gh release edit "$TAG" --title "Imperial Crown 3D ${VERSION} — Android preview" --notes-file "$RUNNER_TEMP/v6-release-notes.md" --prerelease --draft=false
          else
            gh release create "$TAG" imperial-crown-3d-v6.apk apk-sha256.txt --target "$GITHUB_SHA" --prerelease --title "Imperial Crown 3D ${VERSION} — Android preview" --notes-file "$RUNNER_TEMP/v6-release-notes.md"
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | select(.name == "imperial-crown-3d-v6.apk") | .url)'
