name: Build Android APK (v6)

# v6 is its own app (ai.arena.imperialcrown.v6) so it installs side by side with
# v5 and keeps its own save file. A normal push validates the branch but does
# not publish; a release is made by an explicit dispatch, or by a commit whose
# message contains [release v6.0.0-preview].
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the v6 preview APK'
        type: boolean
        default: true
  push:
    branches: [main, 'arena/**']
    paths:
      - 'imperial-crown-v6/**'
      - '.github/workflows/android-v6.yml'
  pull_request:
    branches: [main]
    paths:
      - 'imperial-crown-v6/**'
      - '.github/workflows/android-v6.yml'

permissions:
  contents: write

concurrency:
  group: apk-v6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: imperial-crown-v6
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: imperial-crown-v6/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_ENV"
          echo "PLATFORM=$ANDROID_HOME/platforms/android-34" >> "$GITHUB_ENV"
      - name: Install dependencies and build web assets
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Run full regression suite
        run: |
          set -o pipefail
          eval "$(node scripts/browser-libs.mjs --export)"
          npm run test:ci
      - name: Exercise first person and panels in a mobile-sized browser
        run: |
          eval "$(node scripts/browser-libs.mjs --export)"
          npm run test:v5-browser
      - name: Check the layout on a 892x412 phone screen
        run: |
          eval "$(node scripts/browser-libs.mjs --export)"
          node tests/phoneshot.mjs --out ci/phone
      - name: Build the signed APK
        run: npm run apk
      - name: Verify signatures, identity, alignment and bundled web assets
        run: |
          set -euo pipefail
          APK=build/imperial-crown-6.0.0.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 23 --max-sdk-version 23 "$APK" | grep -F 'Verified using v1 scheme (JAR signing): true'
          "$BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 24 --max-sdk-version 24 "$APK" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          "$BUILD_TOOLS/zipalign" -c -p 4 "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -F "package: name='ai.arena.imperialcrown.v6' versionCode='60000' versionName='6.0.0'"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('build/imperial-crown-6.0.0.apk') as z:
              assert z.getinfo('classes.dex').file_size > 0
              assets = [p for p in Path('dist').rglob('*') if p.is_file()]
              for p in assets:
                  name = 'assets/www/' + p.relative_to('dist').as_posix()
                  assert z.read(name) == p.read_bytes(), f'APK asset mismatch: {name}'
              print(f'Verified {len(assets)} exact web assets and classes.dex')
          PY
          cp "$APK" imperial-crown-3d-v6.apk
          sha256sum imperial-crown-3d-v6.apk > apk-sha256.txt
          cat apk-sha256.txt
      - name: Retain the tested APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: imperial-crown-3d-v6-apk
          path: |
            imperial-crown-v6/imperial-crown-3d-v6.apk
            imperial-crown-v6/apk-sha256.txt
          retention-days: 90
      - name: Publish v6 preview release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release v6.0.0-preview]')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=v6.0.0-preview
          cat > "$RUNNER_TEMP/v6-release-notes.md" <<'NOTES'
          ## Imperial Crown 3D v6 — Android preview

          **A preview, not a performance sign-off.** The Realme 9i layout is checked in CI at its real
          screen shape (892x412 CSS px, both orientations), but sustained frame rate, heat and battery
          use on the physical phone are still unmeasured. The APK is signed with the repository's
          **public demo key**, not a production key — use it for testing only.

          ### In this build

          - **Two thumbs, one phone.** No keyboard and no mouse anywhere. The left thumb steers and
            sprints by pushing past the gold ring; the right thumb drags to look and **taps an enemy
            to lock on**, after which your Champion swings by himself. BLOCK is a toggle, DODGE is a
            tap, and every other action is a pill sized for a fingertip.
          - **The Champion.** The soldier you take control of earns renown for damage, kills, parries,
            spells and razing, climbs six ranks, and chooses one of three permanent perks at each
            rank — more than thirty, wired into the numbers the simulation actually reads.
          - **Directions fixed.** v5 mirrored movement and steering. v6 derives both from the camera's
            own basis; the suite proves it in screen space.
          - **Mages train again.** Mod units may name their training buildings, so the Town Centre
            really produces the Arcane mage, and a cap now says so on the card.
          - **Squads** are audited end to end: form, join, shared experience, ranks that pay armour,
            save and reload, and FOLLOW ME / FOCUS from inside the body.
          - **Sandbox mods are optional** (menu toggle, on by default).

          Installs as `ai.arena.imperialcrown.v6`, so v5 can stay installed beside it. Saves from v5
          are imported read-only and never overwrite the v5 slot. Android 7.0+.

          Download `imperial-crown-3d-v6.apk` below; the SHA-256 file lets you verify it.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" --jq '.object.sha')
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Refusing to overwrite $TAG: it belongs to a different commit." >&2
              exit 1
            fi
            gh release upload "$TAG" imperial-crown-3d-v6.apk apk-sha256.txt --clobber
            gh release edit "$TAG" --title 'Imperial Crown 3D v6 — Android preview' --notes-file "$RUNNER_TEMP/v6-release-notes.md" --prerelease --draft=false
          else
            gh release create "$TAG" imperial-crown-3d-v6.apk apk-sha256.txt --target "$GITHUB_SHA" --prerelease --title 'Imperial Crown 3D v6 — Android preview' --notes-file "$RUNNER_TEMP/v6-release-notes.md"
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | select(.name == "imperial-crown-3d-v6.apk") | .url)'
