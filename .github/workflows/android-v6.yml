name: Build Android APK (v6)

# v6 is its own app (ai.arena.imperialcrown.v6) so it installs side by side with
# v5 and keeps its own save file. A normal push validates the branch but does
# not publish; a release is made by an explicit dispatch, or by a commit whose
# message contains [release v6].
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish the v6 preview APK'
        type: boolean
        default: true
  push:
    branches: [main, 'arena/**']
    paths:
      - 'imperial-crown-v6/**'
      - '.github/workflows/android-v6.yml'
  pull_request:
    branches: [main]
    paths:
      - 'imperial-crown-v6/**'
      - '.github/workflows/android-v6.yml'

permissions:
  contents: write

concurrency:
  group: apk-v6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: imperial-crown-v6
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Read the version this build will carry
        run: |
          node -e '
            const v = require("./package.json").version;
            const [a, b, c] = v.split(".").map(Number);
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_ENV, `VERSION=${v}\nVERSION_CODE=${a * 10000 + b * 100 + (c || 0)}\n`);
            console.log(`version ${v} (${a * 10000 + b * 100 + (c || 0)})`);
          '
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: imperial-crown-v6/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_ENV"
          echo "PLATFORM=$ANDROID_HOME/platforms/android-34" >> "$GITHUB_ENV"
      - name: Install dependencies and build web assets
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Run full regression suite
        run: |
          set -o pipefail
          eval "$(node scripts/browser-libs.mjs --export)"
          npm run test:ci
      - name: Exercise first person and panels in a mobile-sized browser
        run: |
          eval "$(node scripts/browser-libs.mjs --export)"
          npm run test:v5-browser
      - name: Check the layout on a 892x412 phone screen
        run: |
          eval "$(node scripts/browser-libs.mjs --export)"
          node tests/phoneshot.mjs --out ci/phone
      - name: Build the signed APK
        run: npm run apk
      - name: Verify signatures, identity, alignment and bundled web assets
        run: |
          set -euo pipefail
          APK="build/imperial-crown-${VERSION}.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 23 --max-sdk-version 23 "$APK" | grep -F 'Verified using v1 scheme (JAR signing): true'
          "$BUILD_TOOLS/apksigner" verify --verbose --min-sdk-version 24 --max-sdk-version 24 "$APK" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          "$BUILD_TOOLS/zipalign" -c -p 4 "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | grep -F "package: name='ai.arena.imperialcrown.v6' versionCode='${VERSION_CODE}' versionName='${VERSION}'"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os
          VERSION = os.environ["VERSION"]
          with ZipFile(f"build/imperial-crown-{VERSION}.apk") as z:
              assert z.getinfo('classes.dex').file_size > 0
              assets = [p for p in Path('dist').rglob('*') if p.is_file()]
              for p in assets:
                  name = 'assets/www/' + p.relative_to('dist').as_posix()
                  assert z.read(name) == p.read_bytes(), f'APK asset mismatch: {name}'
              print(f'Verified {len(assets)} exact web assets and classes.dex')
          PY
          cp "$APK" imperial-crown-3d-v6.apk
          sha256sum imperial-crown-3d-v6.apk > apk-sha256.txt
          cat apk-sha256.txt
      - name: Retain the tested APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: imperial-crown-3d-v6-apk
          path: |
            imperial-crown-v6/imperial-crown-3d-v6.apk
            imperial-crown-v6/apk-sha256.txt
          retention-days: 90
      - name: Publish v6 preview release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release v6]')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}-preview"
          cat > "$RUNNER_TEMP/v6-release-notes.md" <<'NOTES'
          ## Imperial Crown 3D v6.1.0 — Android preview

          Built from this commit and verified in this run: the whole regression suite, the Chromium
          first-person and panel pass, the 892x412 phone-layout check, the signatures, the alignment,
          the package identity and every byte of the bundled web app.

          **This build is the answer to the list you sent after 6.0.1**, point for point.

          ### Morale is gone as a penalty

          Morale can now only ever *add*: the floor is worth exactly no penalty (same damage, same
          speed, same toughness), it tops out at +8% damage, and no unit can rout at any number. Every
          order is obeyed at every morale. The system that turned your army round is dead; what is
          left is a small bonus for a well-supplied army.

          ### Your side defends itself

          Idle and stand-ground defenders now engage anything inside 13-16 m instead of waiting for a
          man to walk into their faces, with a leash so they do not chase a scout across the island.
          Anything hit -- a soldier, a villager, or a building -- rings an alarm that pulls in every
          idle man within 24 m (30 m for a building). Villagers drop their load and run for the nearest
          roof instead of standing at a tree. Measured: six raiders against six idle spearmen used to
          lose 0 raiders in 40 s while the town centre was chipped down; now the first raider dies at
          ~6 s and all six are dead by 28 s, with the hall untouched.

          ### The court is an appointment and a perk, nothing else

          Writs, decrees, favour, Whispers, Census, Benediction and the council panel are all gone, and
          so is the favour resource -- there is no second currency. Four offices remain, each held by a
          person on the map, each costing gold and ranking up on deeds: Marshal (kills), Chancellor
          (resources), Spymaster (enemy losses), Hierophant (healing). Keep them alive or the office
          stands empty for 25 s and loses a rank.

          ### Building placement is predictable

          Trees now block with their trunk, not their canopy, so a buildable yard no longer reads
          "blocked" because of a tree twelve metres away. A man standing on the spot is reported as
          `unit` in the ghost, and on a real placement he is stepped aside instead of the order being
          refused. The ghost and the building ask the same question, and a footprint can never land on
          the builder in first person.

          ### One mage, six ranks, and rank 6 is a war-ender

          The six duplicate mage cards are gone: one mage is trainable, and it promotes in place. Spell
          damage now scales with rank (`1 + 0.48 * (rank - 1)`, so 3.4x at Ascendant), the whole book
          casts on a real cooldown instead of once a battle, and the spells that did nothing now do
          something: Fireball is 62 damage plus a five-second burn in a 3.4 m blast on a 3.2 s
          cooldown, Ice Lance actually hits the man you aimed it at (its line test excluded the
          target), Chain Lightning leaps six times, Frost Nova freezes what surrounds you, and a rank-6
          Ascendant kills a swordsman with one fireball before the burn even starts. A spell also goes
          where you pointed: the tapped lock beats the crosshair. Ward and Nova were never broken --
          they are self-centred and simply had no target to aim at.

          ### Also fixed

          - A unit kept the camera's yaw as its facing after you left first person, so it walked away
            staring at a spot on the ground ("units turning away for no reason").
          - An AI wave whose target hall had been razed marched to a field of ash and stood in it
            forever. With the hall gone the wave now follows the nearest thing the crown still owns.

          It installs **over 6.0.1** (same key, versionCode 60100) and stays beside v5. Signed with the
          repository's public demo key for testing. Sustained frame rate, heat and battery on the
          physical Realme 9i are still unmeasured -- that needs the phone.

          Download `imperial-crown-3d-v6.apk` below; the SHA-256 file lets you verify it.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" --jq '.object.sha')
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Refusing to overwrite $TAG: it belongs to a different commit." >&2
              exit 1
            fi
            gh release upload "$TAG" imperial-crown-3d-v6.apk apk-sha256.txt --clobber
            gh release edit "$TAG" --title "Imperial Crown 3D ${VERSION} — Android preview" --notes-file "$RUNNER_TEMP/v6-release-notes.md" --prerelease --draft=false
          else
            gh release create "$TAG" imperial-crown-3d-v6.apk apk-sha256.txt --target "$GITHUB_SHA" --prerelease --title "Imperial Crown 3D ${VERSION} — Android preview" --notes-file "$RUNNER_TEMP/v6-release-notes.md"
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | select(.name == "imperial-crown-3d-v6.apk") | .url)'
